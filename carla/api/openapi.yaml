openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /v1/status:
    get:
      summary: Status
      operationId: status_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                type: object
                title: Response Status V1 Status Get
  /v1/run:
    post:
      summary: Run
      operationId: run_v1_run_post
      parameters:
      - name: render_off_screen
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Render Off Screen
      - name: quality_level
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/QualityLevel'
          default: Low
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Run V1 Run Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/stop:
    post:
      summary: Stop
      operationId: stop_v1_stop_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                type: object
                title: Response Stop V1 Stop Post
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QualityLevel:
      type: string
      enum:
      - Epic
      - Low
      title: QualityLevel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
