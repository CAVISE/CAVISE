name: "build docs OpenCDA + Artery"

on:
  push:
    branches: [ main, docs-pipeline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: settings py
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"


      - name: Install OpenCDA docs dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install sphinx sphinx-rtd-theme recommonmark
          if [ -f extern/opencda/docs/ci-requirements.txt ]; then
            python -m pip install -r extern/opencda/docs/ci-requirements.txt
          elif [ -f extern/opencda/docs/requirements.txt ]; then
            python -m pip install -r extern/opencda/docs/requirements.txt
          else
            echo "no requirements file"
          fi
      

      - name: build Sphinx
        working-directory: extern/opencda/docs
        run: |
          python -m sphinx -b html . _build/html


      - name: install artery docs
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install mkdocs

      - name: build MkDocs
        working-directory: extern/artery
        run: |
          mkdocs build --clean --site-dir site


      - name: artery + opencda
        run: |
          mkdir -p artifacts/opencda artifacts/artery
          cp -r extern/opencda/docs/_build/html/* artifacts/opencda/ || true
          cp -r extern/artery/site/* artifacts/artery/ || true

      - name: upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: artifacts
