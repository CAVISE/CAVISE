name: "build docs OpenCDA + Artery"

on:
  push:
    branches: [ "main", "docs-pipeline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Python setings
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install OpenCDA
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install sphinx sphinx-rtd-theme recommonmark

      - name: Build OpenCDA
        working-directory: extern/opencda/docs
        env:
          PYTHONPATH: ${{ github.workspace }}/extern/opencda
        run: |
          python -m sphinx -b html . _build/html

      - name: Install artery
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install mkdocs mkdocs-material pymdown-extensions mkdocs-git-revision-date-localized-plugin

      - name: Build artery
        working-directory: extern/artery
        run: |
          sed '/^[[:space:]]*- vidify[[:space:]]*$/d' mkdocs.yml > mkdocs.ci.yml
          mkdocs build -f mkdocs.ci.yml --clean --site-dir site

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/opencda artifacts/artery
          cp -r extern/opencda/docs/_build/html/* artifacts/opencda/
          cp -r extern/artery/site/* artifacts/artery/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: artifacts
