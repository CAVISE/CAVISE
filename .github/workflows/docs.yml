name: "build docs OpenCDA + Artery"

on:
  push:
    branches: [ "main", "docs-pipeline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Python settings
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install OpenCDA
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install sphinx sphinx-rtd-theme recommonmark

      - name: Build OpenCDA
        working-directory: extern/opencda/docs
        env:
          PYTHONPATH: ${{ github.workspace }}/extern/opencda
        run: |
          python -m sphinx -b html . _build/html

      - name: Install artery
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install mkdocs mkdocs-material pymdown-extensions mkdocs-git-revision-date-localized-plugin

      - name: Build artery
        working-directory: extern/artery
        run: |
          sed '/^[[:space:]]*- vidify[[:space:]]*$/d' mkdocs.yml > mkdocs.ci.yml
          mkdocs build -f mkdocs.ci.yml --clean --site-dir site

      - name: Prepare site for Pages
        run: |
          mkdir -p site/opencda site/artery
          cp -r extern/opencda/docs/_build/html/* site/opencda/
          cp -r extern/artery/site/* site/artery/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Docs</title></head>
            <body>
              <h1>Documentation</h1>
              <ul>
                <li><a href="./opencda/">OpenCDA (Sphinx)</a></li>
                <li><a href="./artery/">Artery (MkDocs)</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
