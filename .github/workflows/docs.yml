name: "build docs OpenCDA + Artery"

on:
  push:
    branches: [ main, docs-pipeline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install OpenCDA
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r extern/opencda/docs/requirements.txt
          pip install sphinx sphinx-rtd-theme recommonmark

      - name: Build OpenCDA
        working-directory: extern/opencda/docs
        run: |
          python -m sphinx -b html . _build/html

      - name: Prepare combined artifacts
        run: |
          mkdir -p artifacts/opencda artifacts/artery
          cp -r extern/opencda/docs/_build/html/* artifacts/opencda/ || true
          cp -r extern/artery/docs/* artifacts/artery/ || true
          cp extern/artery/mkdocs.yml artifacts/artery/ || true

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: artifacts
