version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    insecure-external-code-execution: allow
    schedule:
      interval: "monthly"
    groups:
      python-packages:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-updates:
        patterns:
          - "*"
